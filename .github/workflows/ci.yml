# Comprueba en Linux y en Windows que todo compila, pasa clippy sin avisos y pasa los tests.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  comprobar:
    name: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
