[workspace]
resolver = "2"
members = ["crates/comic-core", "crates/comic-imagen", "crates/comic-biblioteca", "crates/comic-novedades", "crates/comic-vinetas", "crates/comic-app"]

# Valores compartidos: cada crate los hereda con `version.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2021"

# En desarrollo, nuestro código compila rápido sin optimizar, pero las dependencias
# (decodificar JPG, descomprimir zip) se optimizan: sin esto van decenas de veces más lentas.
[profile.dev.package."*"]
opt-level = 3

# Decodificar y encoger páginas también tiene que ir rápido mientras desarrollamos, pero
# eso no basta con optimizar `fast_image_resize`: su código genérico se compila en el
# crate que lo llama. Por eso todo ese trabajo vive en `comic-imagen` y se optimiza solo
# ese crate (sin esto, encoger una página tarda ~2 s en vez de ~30 ms).
[profile.dev.package.comic-imagen]
opt-level = 3

# Buscar los recuadros recorre la página entera varias veces: sin optimizar, en
# desarrollo iría decenas de veces más lento que en la app instalada.
[profile.dev.package.comic-vinetas]
opt-level = 3
