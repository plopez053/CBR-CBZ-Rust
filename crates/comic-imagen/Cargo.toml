[package]
name = "comic-imagen"
version.workspace = true
edition.workspace = true

[dependencies]
# Encoge las páginas con Lanczos3 usando SIMD: mucho más rápido que el `resize` de `image`.
fast_image_resize = "6.1.0"
# Solo los formatos que aparecen en cómics; así compila más rápido.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
