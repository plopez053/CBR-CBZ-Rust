[package]
name = "comic-novedades"
version.workspace = true
edition.workspace = true

[dependencies]
comic-biblioteca = { path = "../comic-biblioteca" }
comic-core = { path = "../comic-core" }
natord = "1.0.9"
# RSS y Atom.
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# HTTPS con rustls: no depende de OpenSSL ni de nada instalado en el sistema.
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
